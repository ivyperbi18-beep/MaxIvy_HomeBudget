<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stanbic Joint Account Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      onSnapshot, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Make Firebase modules accessible to Alpine.js
    window.db = db;
    window.firestore = { doc, setDoc, getDoc, collection, onSnapshot, deleteDoc };
  </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800" x-data="budgetApp()" x-init="initApp()">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-2xl text-blue-400"></i>
        <h1 class="text-xl font-bold tracking-wide">Stanbic Joint Account Hub</h1>
      </div>

      <div class="flex items-center space-x-4">
        <!-- Year Selector -->
        <div class="flex items-center space-x-2">
          <label for="yearSelect" class="text-sm font-medium text-gray-300">Year:</label>
          <select 
            id="yearSelect" 
            x-model="selectedYear" 
            class="bg-slate-800 text-white border border-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5"
          >
            <template x-for="y in availableYears" :key="y">
              <option :value="y" x-text="y" :selected="y === selectedYear"></option>
            </template>
          </select>
        </div>

        <!-- Month Selector -->
        <div class="flex items-center space-x-2">
          <label for="monthSelect" class="text-sm font-medium text-gray-300">Month:</label>
          <select 
            id="monthSelect" 
            x-model="selectedMonth" 
            class="bg-slate-800 text-white border border-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5"
          >
            <template x-for="(m, index) in months" :key="index">
              <option :value="index" x-text="m" :selected="index == selectedMonth"></option>
            </template>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Overall Annual Budget Summary Banner -->
    <div class="bg-white rounded-xl shadow p-6 border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h2 class="text-lg font-semibold text-gray-600">Annual Budget Overview (<span x-text="selectedYear"></span>)</h2>
        <div class="text-3xl font-extrabold text-gray-900 mt-1" x-text="formatCurrency(annualBudget)"></div>
        <p class="text-xs text-gray-500 mt-1">Changes to annual budget apply exclusively to <span class="font-bold" x-text="selectedYear"></span>.</p>
      </div>
      <button 
        @click="openBudgetModal()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center gap-2"
      >
        <i class="fa-solid fa-pen"></i> Edit <span x-text="selectedYear"></span> Annual Budget
      </button>
    </div>

    <!-- Category Overview / Budget Allocation Matrix -->
    <section class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
      <div class="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <div>
          <h2 class="text-lg font-bold text-gray-800">Category Allocations (<span x-text="selectedYear"></span>)</h2>
          <span class="text-xs px-2 py-1 rounded bg-slate-200 text-slate-700 font-semibold" x-text="selectedYear <= 2026 ? 'Old Categories (Pre-2027)' : 'New Categories (2027 Onwards)'"></span>
        </div>
        <button 
          @click="openCategoryModal()" 
          class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-3 rounded-lg transition flex items-center gap-2"
        >
          <i class="fa-solid fa-plus"></i> Add Category
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-100 text-gray-700 uppercase text-xs font-semibold">
            <tr>
              <th class="py-3 px-4">Category</th>
              <th class="py-3 px-4">Annual Target</th>
              <th class="py-3 px-4">Monthly Target</th>
              <th class="py-3 px-4">Spent (<span x-text="months[selectedMonth]"></span>)</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <template x-for="cat in categories" :key="cat.id">
              <tr class="hover:bg-gray-50">
                <td class="py-3 px-4 font-medium text-gray-900" x-text="cat.name"></td>
                <td class="py-3 px-4" x-text="formatCurrency(cat.annualTarget || 0)"></td>
                <td class="py-3 px-4" x-text="formatCurrency((cat.annualTarget || 0) / 12)"></td>
                <td class="py-3 px-4" x-text="formatCurrency(getCategoryMonthlyExpense(cat.id))"></td>
                <td class="py-3 px-4">
                  <template x-let="[spent = getCategoryMonthlyExpense(cat.id), limit = (cat.annualTarget || 0) / 12]">
                    <span 
                      class="px-2.5 py-1 rounded-full text-xs font-semibold"
                      :class="spent > limit ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'"
                      x-text="spent > limit ? 'Over Budget' : 'On Track'"
                    ></span>
                  </template>
                </td>
                <td class="py-3 px-4 text-right space-x-2">
                  <button @click="openCategoryModal(cat)" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen-to-square"></i></button>
                  <button @click="deleteCategory(cat.id)" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                </td>
              </tr>
            </template>
            <template x-if="categories.length === 0">
              <tr>
                <td colspan="6" class="text-center py-6 text-gray-400">No categories found for <span x-text="selectedYear"></span>.</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Edit Annual Budget Modal -->
  <div x-show="showBudgetModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-4" @click.away="showBudgetModal = false">
      <h3 class="text-lg font-bold text-gray-900">Set Annual Budget for <span x-text="selectedYear"></span></h3>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Annual Target Amount</label>
        <input type="number" x-model.number="budgetInput" class="w-full border rounded-lg p-2.5 text-gray-900 focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div class="flex justify-end space-x-3 pt-2">
        <button @click="showBudgetModal = false" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">Cancel</button>
        <button @click="saveAnnualBudget()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Budget</button>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div x-show="showCategoryModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" x-cloak>
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6 space-y-4" @click.away="showCategoryModal = false">
      <h3 class="text-lg font-bold text-gray-900" x-text="editingCategory ? 'Edit Category' : 'New Category'"></h3>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category Name</label>
        <input type="text" x-model="categoryForm.name" class="w-full border rounded-lg p-2.5 text-gray-900 focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Annual Target Allocation (<span x-text="selectedYear"></span>)</label>
        <input type="number" x-model.number="categoryForm.annualTarget" class="w-full border rounded-lg p-2.5 text-gray-900 focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>
      <div class="flex justify-end space-x-3 pt-2">
        <button @click="showCategoryModal = false" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">Cancel</button>
        <button @click="saveCategory()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Save Category</button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    function budgetApp() {
      return {
        householdId: 'stanbic-joint-hub',
        selectedYear: 2026,
        selectedMonth: new Date().getMonth(),
        availableYears: [2024, 2025, 2026, 2027, 2028],
        months: [
          'January', 'February', 'March', 'April', 'May', 'June',
          'July', 'August', 'September', 'October', 'November', 'December'
        ],

        annualBudget: 0,
        categories: [],
        expenses: [],
        allotments: [],

        // Active Firestore Subscriptions
        unsubscribers: [],

        // Modals & Form States
        showBudgetModal: false,
        budgetInput: 0,

        showCategoryModal: false,
        editingCategory: null,
        categoryForm: {
          name: '',
          annualTarget: 0
        },

        // Legacy Category Defaults (2026 & older - Old Code)
        legacyDefaultCategories: [
          { id: 'cat-home-leisure', name: 'Home & Leisure', annualTarget: 4000 },
          { id: 'cat-family-personal', name: 'Family & Personal', annualTarget: 6000 },
          { id: 'cat-food-groceries', name: 'Food & Groceries', annualTarget: 12000 },
          { id: 'cat-utilities', name: 'Utilities', annualTarget: 3600 },
          { id: 'cat-transport', name: 'Transport & Fuel', annualTarget: 4800 }
        ],

        // New Category Defaults (2027 onwards - Rent as Lump-Sum)
        newDefaultCategories: [
          { id: 'cat-living-exp', name: 'Living Expenses', annualTarget: 12000 },
          { id: 'cat-rent-lump', name: 'Rent', annualTarget: 24000 },
          { id: 'cat-emergency-health', name: 'Emergency & Health Fund', annualTarget: 6000 },
          { id: 'cat-housing-util', name: 'Housing & Utilities', annualTarget: 4800 },
          { id: 'cat-entertainment', name: 'Entertainment', annualTarget: 2400 }
        ],

        initApp() {
          // Re-subscribe to listeners whenever the selected year changes
          this.$watch('selectedYear', (newYear) => {
            this.selectedYear = parseInt(newYear);
            this.listenToFirestore();
          });

          this.listenToFirestore();
        },

        // Re-attach listeners to year-isolated Firestore subcollections
        listenToFirestore() {
          if (!window.db) {
            setTimeout(() => this.listenToFirestore(), 200);
            return;
          }

          // Unsubscribe existing Firestore listeners
          this.unsubscribers.forEach(unsub => unsub());
          this.unsubscribers = [];

          const { doc, collection, onSnapshot, setDoc } = window.firestore;
          const currentYearStr = String(this.selectedYear);

          // 1. Year-isolated Annual Budget Target
          const yearRef = doc(window.db, 'households', this.householdId, 'years', currentYearStr);
          const unsubYear = onSnapshot(yearRef, (snapshot) => {
            if (snapshot.exists()) {
              this.annualBudget = snapshot.data().annualBudget || 0;
            } else {
              this.annualBudget = 0;
            }
          });
          this.unsubscribers.push(unsubYear);

          // 2. Year-isolated Category Schema
          const categoriesRef = collection(window.db, 'households', this.householdId, 'years', currentYearStr, 'categories');
          const unsubCat = onSnapshot(categoriesRef, async (snapshot) => {
            if (!snapshot.empty) {
              this.categories = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            } else {
              // Select correct default schema: <=2026 gets old categories, >=2027 gets new categories
              const defaults = this.selectedYear <= 2026 ? this.legacyDefaultCategories : this.newDefaultCategories;
              this.categories = defaults;
              
              // Seed into Firestore so year collection is populated
              for (const item of defaults) {
                await setDoc(doc(window.db, 'households', this.householdId, 'years', currentYearStr, 'categories', item.id), item);
              }
            }
          });
          this.unsubscribers.push(unsubCat);

          // 3. Year-isolated Expenses
          const expensesRef = collection(window.db, 'households', this.householdId, 'years', currentYearStr, 'expenses');
          const unsubExp = onSnapshot(expensesRef, (snapshot) => {
            this.expenses = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          });
          this.unsubscribers.push(unsubExp);
        },

        // Actions: Annual Budget (Isolated per year)
        openBudgetModal() {
          this.budgetInput = this.annualBudget;
          this.showBudgetModal = true;
        },

        async saveAnnualBudget() {
          const { doc, setDoc } = window.firestore;
          const currentYearStr = String(this.selectedYear);
          const yearRef = doc(window.db, 'households', this.householdId, 'years', currentYearStr);

          await setDoc(yearRef, { annualBudget: Number(this.budgetInput) }, { merge: true });
          this.showBudgetModal = false;
        },

        // Actions: Categories (Isolated per year)
        openCategoryModal(cat = null) {
          if (cat) {
            this.editingCategory = cat.id;
            this.categoryForm = { name: cat.name, annualTarget: cat.annualTarget };
          } else {
            this.editingCategory = null;
            this.categoryForm = { name: '', annualTarget: 0 };
          }
          this.showCategoryModal = true;
        },

        async saveCategory() {
          const { doc, setDoc } = window.firestore;
          const currentYearStr = String(this.selectedYear);
          const catId = this.editingCategory || 'cat-' + Date.now();

          const payload = {
            id: catId,
            name: this.categoryForm.name,
            annualTarget: Number(this.categoryForm.annualTarget)
          };

          await setDoc(
            doc(window.db, 'households', this.householdId, 'years', currentYearStr, 'categories', catId),
            payload
          );

          this.showCategoryModal = false;
        },

        async deleteCategory(catId) {
          if (!confirm('Are you sure you want to delete this category for ' + this.selectedYear + '?')) return;
          const { doc, deleteDoc } = window.firestore;
          const currentYearStr = String(this.selectedYear);

          await deleteDoc(
            doc(window.db, 'households', this.householdId, 'years', currentYearStr, 'categories', catId)
          );
        },

        // Helpers
        getCategoryMonthlyExpense(categoryId) {
          return this.expenses
            .filter(e => e.categoryId === categoryId && e.month === parseInt(this.selectedMonth))
            .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        },

        formatCurrency(amount) {
          return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
        }
      }
    }
  </script>
</body>
</html>
